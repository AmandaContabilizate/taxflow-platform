<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bienvenida: ¿qué hacemos por ti?</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: white;
      text-align: center;
      position: relative;
    }

    .header {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #10B981;
      margin-bottom: 10px;
      animation: fadeInDown 0.6s ease-out;
    }

    .title {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 40px;
      animation: fadeInDown 0.8s ease-out 0.2s both;
    }

    .phone-mockup {
      position: relative;
      width: 300px;
      height: 600px;
      background: white;
      border-radius: 40px;
      padding: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: zoomIn 0.8s ease-out 0.4s both;
      margin-bottom: 40px;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 35px;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow: hidden;
      position: relative;
    }

    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 28px;
      background: black;
      border-radius: 0 0 20px 20px;
      z-index: 10;
    }

    .back-btn {
      text-align: left;
      margin-bottom: 20px;
      color: #333;
      font-size: 16px;
      font-weight: 600;
      animation: slideInLeft 0.6s ease-out 0.6s both;
    }

    .feature-item {
      background: #F5F5F5;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
      opacity: 0;
      animation: slideInLeft 0.6s ease-out forwards;
      border-left: 4px solid #10B981;
    }

    .feature-item:nth-child(2) { animation-delay: 0.7s; }
    .feature-item:nth-child(3) { animation-delay: 0.85s; }
    .feature-item:nth-child(4) { animation-delay: 1s; }

    .feature-icon {
      font-size: 24px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .feature-text {
      flex: 1;
    }

    .feature-title {
      font-weight: 600;
      color: #0F172A;
      font-size: 13px;
      margin-bottom: 3px;
      line-height: 1.3;
    }

    .feature-desc {
      font-size: 11px;
      color: #999;
      line-height: 1.3;
    }

    .check-icon {
      width: 20px;
      height: 20px;
      background: #10B981;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .bottom-text {
      font-size: 28px;
      font-weight: 700;
      margin-top: 40px;
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeInUp 0.8s ease-out 1.2s both;
    }

    .nav-bar {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-around;
      padding: 12px;
      background: #F5F5F5;
      border-radius: 30px;
      font-size: 12px;
      color: #999;
    }

    .nav-icon {
      font-size: 18px;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes zoomIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">¿QUÉ HACEMOS?</div>
    <div class="title">Por ti en Contabilízate</div>

    <div class="phone-mockup">
      <div class="phone-screen">
        <div class="notch"></div>
        <div class="back-btn">< Volver</div>

        <div class="feature-item">
          <div class="feature-icon">📊</div>
          <div class="feature-text">
            <div class="feature-title">Contabilidad mensual</div>
            <div class="feature-desc">Gestión completa del SAT</div>
          </div>
          <div class="check-icon">✓</div>
        </div>

        <div class="feature-item">
          <div class="feature-icon">💰</div>
          <div class="feature-text">
            <div class="feature-title">Optimizar deducciones</div>
            <div class="feature-desc">Paga solo lo necesario</div>
          </div>
          <div class="check-icon">✓</div>
        </div>

        <div class="feature-item">
          <div class="feature-icon">📄</div>
          <div class="feature-text">
            <div class="feature-title">Facturas electrónicas</div>
            <div class="feature-desc">CFDIs y comprobantes</div>
          </div>
          <div class="check-icon">✓</div>
        </div>

        <div class="feature-item">
          <div class="feature-icon">👥</div>
          <div class="feature-text">
            <div class="feature-title">Asesoría especializada</div>
            <div class="feature-desc">Contadores a tu servicio</div>
          </div>
          <div class="check-icon">✓</div>
        </div>

        <div class="nav-bar">
          <div class="nav-icon">🏠</div>
          <div class="nav-icon">🔍</div>
          <div class="nav-icon">➕</div>
          <div class="nav-icon">🔔</div>
          <div class="nav-icon">👤</div>
        </div>
      </div>
    </div>

    <div class="bottom-text">Tu gestión fiscal simplificada.</div>
  </div>
</body>
</html>
